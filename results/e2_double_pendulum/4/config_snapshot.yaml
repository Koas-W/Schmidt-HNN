experiment:
  experiment: e2_double_pendulum
  data_config: configs/double_pendulum.yaml
  models:
    list:
    - mlp_ode
    - ahnn
    - symoden_mu
    - pshnn_concat
    - sep_hnn
    - pshnn_mlp
    - pshnn_silu
    - pshnn
    target_params: 40000
    pshnn:
      R: 2
      R_L: 3
      depth: 2
      block: swiglu
      bias_head: true
      mass_param: direct
    pshnn_mlp:
      R: 2
      R_L: 3
      depth: 2
      bias_head: true
      mass_param: direct
    pshnn_silu:
      R: 2
      R_L: 3
      depth: 2
      bias_head: true
      mass_param: direct
    pshnn_concat:
      depth: 2
      block: swiglu
      mass_param: direct
    sep_hnn:
      R: 8
      depth: 2
      block: swiglu
    ahnn:
      depth: 2
    mlp_ode:
      depth: 2
  train:
    seeds:
    - 0
    - 1
    - 2
    - 3
    - 4
    lr_grid:
    - 0.001
    - 0.0003
    batch_size: 8192
    max_steps: 20000
    eval_every: 100
    patience: 30
    weight_decay: 0.0001
    cuda_graph: true
    device: auto
data:
  system: double_pendulum
  data:
    dt: 0.002
    t_span: 20.0
    sample_every: 50
    noise_std: 0.0
    seed: 1234
    n_traj:
      train: 20
      val: 4
      test: 8
    mu_split:
      n_train_per_dim: 5
      extrap_frac: 0.3
      n_extrap_side: 2
  eval:
    rollout_t_short: 20.0
    rollout_t_long: 100.0
    n_rollout: 8
