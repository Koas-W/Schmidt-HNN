experiment:
  experiment: e1_pendulum
  data_config: configs/pendulum.yaml
  models:
    list:
    - mlp_ode
    - ahnn
    - symoden_mu
    - pshnn_concat
    - sep_hnn
    - pshnn_mlp
    - pshnn_silu
    - pshnn
    target_params: 40000
    pshnn:
      R: 1
      R_L: 1
      depth: 2
      block: swiglu
      bias_head: true
      mass_param: direct
    pshnn_mlp:
      R: 1
      R_L: 1
      depth: 2
      bias_head: true
      mass_param: direct
    pshnn_silu:
      R: 1
      R_L: 1
      depth: 2
      bias_head: true
      mass_param: direct
    pshnn_concat:
      depth: 2
      block: swiglu
      mass_param: direct
    sep_hnn:
      R: 8
      depth: 2
      block: swiglu
    ahnn:
      depth: 2
    mlp_ode:
      depth: 2
  train:
    seeds:
    - 0
    - 1
    - 2
    - 3
    - 4
    lr_grid:
    - 0.001
    - 0.0003
    batch_size: 8192
    max_steps: 20000
    eval_every: 100
    patience: 30
    weight_decay: 0.0001
    cuda_graph: true
    device: auto
data:
  system: pendulum
  data:
    dt: 0.01
    t_span: 20.0
    sample_every: 10
    noise_std: 0.0
    seed: 1234
    n_traj:
      train: 50
      val: 10
      test: 20
    mu_split:
      n_train_per_dim: 4
      extrap_frac: 0.3
      n_extrap_side: 2
  eval:
    rollout_t_short: 20.0
    rollout_t_long: 314.0
    n_rollout: 8
