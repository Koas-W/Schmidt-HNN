config:
  name: hh1p
  system: henon_heiles_ahnn
  data:
    dt: 0.01
    t_span: 1000.0
    sample_every: 10
    noise_std: 0.0
    seed: 1234
    n_traj:
      train: 7
      val: 3
      test: 4
    mu_split:
      n_train_per_dim: 4
      extrap_frac: 0.3
      n_extrap_side: 2
  models:
    list:
    - mlp_ode
    - ahnn
    - symoden_mu
    - pshnn_concat
    - sep_hnn
    - pshnn_mlp
    - pshnn_silu
    - pshnn
    target_params: 40000
    pshnn:
      R: 2
      R_L: 1
      depth: 2
      block: swiglu
      bias_head: true
      mass_param: direct
    pshnn_mlp:
      R: 2
      R_L: 1
      depth: 2
      bias_head: true
      mass_param: direct
    pshnn_silu:
      R: 2
      R_L: 1
      depth: 2
      bias_head: true
      mass_param: direct
    pshnn_concat:
      depth: 2
      block: swiglu
      mass_param: direct
    sep_hnn:
      R: 8
      depth: 2
      block: swiglu
    ahnn:
      depth: 2
    mlp_ode:
      depth: 2
  train:
    seeds:
    - 0
    - 1
    - 2
    - 3
    - 4
    lr_grid:
    - 0.001
    - 0.0003
    batch_size: 8192
    max_steps: 20000
    eval_every: 100
    patience: 30
    weight_decay: 0.0001
    cuda_graph: true
    device: auto
  eval:
    rollout_t_short: 20.0
    rollout_t_long: 100.0
    n_rollout: 8
  deltaV:
    lam_min: 0.05
    lam_max: 1.0
    n_lam: 96
