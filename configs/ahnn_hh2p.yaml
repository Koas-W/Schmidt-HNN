# Unified training protocol: 20000 steps, patience 30, lr grid {1e-3, 3e-4, 1e-4}, CUDA Graph; the Schmidt-HNN family represents M, ranks taken from the spectrum (spectral rank of V + mu-independent bias head).
# AHNN replication: asymmetric two-parameter Henon-Heiles (Han et al. 2021, Sec. IV.B, Eq. 7, Fig. 8)
# H = (p1^2+p2^2)/2 + (q1^2+q2^2)/2 + lambda1 q1^2 q2 - (lambda2/3) q2^3, two parameter channels.
# Follows the paper: 4x4=16 grid lambda1,lambda2 in {0.2,0.4,0.6,0.8}, 5 energies per pair, E threshold computed numerically per point.
name: hh2p
system: henon_heiles_2p

data:
  dt: 0.01
  t_span: 1000.0
  sample_every: 10
  noise_std: 0.0
  seed: 1234
  n_traj:
    train: 5          # AHNN Sec. IV.B: 5 energies per (lambda1,lambda2), one trajectory each
    val: 2
    test: 3
  mu_split:
    n_train_per_dim: 4   # lambda1,lambda2 in {0.2,0.4,0.6,0.8} -> 4x4=16 grid points
    extrap_frac: 0.3
    n_extrap_side: 2

models:
  list: [mlp_ode, ahnn, symoden_mu, pshnn_concat, sep_hnn, pshnn_mlp, pshnn_silu, pshnn]
  target_params: 40000
  pshnn:        {R: 3, R_L: 1, depth: 2, block: swiglu, bias_head: true, mass_param: direct}   # HH two-parameter: V rank 3, M = I
  pshnn_mlp:    {R: 3, R_L: 1, depth: 2, bias_head: true, mass_param: direct}
  pshnn_silu:   {R: 3, R_L: 1, depth: 2, bias_head: true, mass_param: direct}   # ungated SiLU block (same settings as pshnn_mlp)
  pshnn_concat: {depth: 2, block: swiglu, mass_param: direct}
  sep_hnn:      {R: 8, depth: 2, block: swiglu}
  ahnn: {depth: 2}
  mlp_ode: {depth: 2}

train:
  seeds: [0, 1, 2, 3, 4]
  lr_grid: [1.0e-3, 3.0e-4, 1.0e-4]   # learning-rate grid used in the paper; 1e-4 was never selected by validation
  batch_size: 8192
  max_steps: 20000
  eval_every: 100
  patience: 30
  weight_decay: 1.0e-4
  cuda_graph: true
  device: auto

eval:
  rollout_t_short: 20.0
  rollout_t_long: 100.0
  n_rollout: 8

# dense <DeltaV> sweep over the (lambda1,lambda2) plane (used by the runner)
deltaV:
  lam_min: 0.05
  lam_max: 1.0
  n_lam: 40   # 40x40 grid heatmap
