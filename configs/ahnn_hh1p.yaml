# Unified training protocol: 20000 steps, patience 30, lr grid {1e-3, 3e-4, 1e-4}, CUDA Graph; the Schmidt-HNN family represents M, ranks taken from the spectrum (spectral rank of V + mu-independent bias head).
# AHNN replication: Henon-Heiles single-parameter flagship (Han et al. 2021, PRR 3, 023156, Sec. III)
# Follows the paper's data protocol: lambda in {0.2,0.4,0.6,0.8} grid, fixed working energy E=1/6,
# 7 random initial conditions below the energy threshold per lambda, t in [0,1000], sampling dt=0.1.
# Training side: parameter count locked at 40000, convergence budget, 5 seeds (this project's protocol).
name: hh1p
system: henon_heiles_ahnn

data:
  dt: 0.01            # integration step (RK4, energy drift ~2e-11, far below the AHNN 1e-6)
  t_span: 1000.0      # AHNN: 0<=t<=1000 (hundreds of oscillation periods)
  sample_every: 10    # storage interval 0.1 (AHNN sampling dt)
  noise_std: 0.0      # AHNN: no noise
  seed: 1234
  n_traj:
    train: 7          # AHNN Table II: 7 initial conditions/energies per lambda
    val: 3            # this project's protocol: used for lr selection
    test: 4           # vf_mse / supporting evidence
  mu_split:
    n_train_per_dim: 4   # lambda in {0.2, 0.4, 0.6, 0.8} (linspace(0.2,0.8,4))
    extrap_frac: 0.3     # extrap -> {0.02,0.11,0.89,0.98}
    n_extrap_side: 2

models:
  list: [mlp_ode, ahnn, symoden_mu, pshnn_concat, sep_hnn, pshnn_mlp, pshnn_silu, pshnn]
  target_params: 40000
  pshnn:        {R: 2, R_L: 1, depth: 2, block: swiglu, bias_head: true, mass_param: direct}   # HH one-parameter: V rank 2 (harmonic oscillator + lambda term), M = I
  pshnn_mlp:    {R: 2, R_L: 1, depth: 2, bias_head: true, mass_param: direct}
  pshnn_silu:   {R: 2, R_L: 1, depth: 2, bias_head: true, mass_param: direct}   # ungated SiLU block (same settings as pshnn_mlp)
  pshnn_concat: {depth: 2, block: swiglu, mass_param: direct}
  sep_hnn:      {R: 8, depth: 2, block: swiglu}
  ahnn: {depth: 2}
  mlp_ode: {depth: 2}

train:
  seeds: [0, 1, 2, 3, 4]
  lr_grid: [1.0e-3, 3.0e-4, 1.0e-4]   # learning-rate grid used in the paper; 1e-4 was never selected by validation
  batch_size: 8192
  max_steps: 20000
  eval_every: 100
  patience: 30
  weight_decay: 1.0e-4
  cuda_graph: true
  device: auto

eval:
  rollout_t_short: 20.0
  rollout_t_long: 100.0
  n_rollout: 8

# dense <DeltaV>-vs-lambda sweep range (used by the runner)
deltaV:
  lam_min: 0.05
  lam_max: 1.0
  n_lam: 96
